# Fly.io config for the game server. Create the app first: fly launch --no-deploy --copy-config
app = "espiao-server"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Set the real value with: fly secrets set CORS_ORIGIN=https://your-app.vercel.app
  CORS_ORIGIN = "http://localhost:5173"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory: never stop the machine, and never run more than one.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
